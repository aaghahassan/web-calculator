<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../src/output.css">
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white border-2 border-[#a2828b] rounded p-8 w-full max-w-sm">

        <h1 class="text-3xl font-bold text-[#8c6a74] mb-8 text-center">
            Calculator
        </h1>

        <!-- First Number -->
        <input
            type="number"
            id="num1"
            placeholder="Enter first number"
            class="w-full px-3 py-2 mb-4 border-2 border-[#a2828b] rounded"
        >

        <!-- Second Number -->
        <input
            type="number"
            id="num2"
            placeholder="Enter second number"
            class="w-full px-3 py-2 mb-6 border-2 border-[#a2828b] rounded"
        >

        <!-- Buttons -->
        <div class="flex justify-center gap-3 mb-8">

            <button
                onclick="calculate('+')"
                class="w-12 h-12 border-2 border-[#a2828b] text-[#8c6a74] text-xl rounded">
                +
            </button>

            <button
                onclick="calculate('-')"
                class="w-12 h-12 border-2 border-[#a2828b] text-[#8c6a74] text-xl rounded">
                -
            </button>

            <button
                onclick="calculate('*')"
                class="w-12 h-12 border-2 border-[#a2828b] text-[#8c6a74] text-xl rounded">
                *
            </button>

            <button
                onclick="calculate('/')"
                class="w-12 h-12 border-2 border-[#a2828b] text-[#8c6a74] text-xl rounded">
                /
            </button>

        </div>

        <!-- Result -->
        <div id="result" class="text-2xl font-bold text-[#8c6a74] text-center">
            Result
        </div>

    </div>


    <script>

        function calculate(operator) {

            // Get numbers from input boxes
            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;

            // Check if inputs are empty
            if (num1 == "" || num2 == "") {
                document.getElementById("result").innerHTML =
                    "Please enter both numbers!";
                return;
            }

            // Convert input values into numbers
            num1 = Number(num1);
            num2 = Number(num2);

            let result;

            // Perform calculation
            if (operator == "+") {
                result = num1 + num2;
            }
            else if (operator == "-") {
                result = num1 - num2;
            }
            else if (operator == "*") {
                result = num1 * num2;
            }
            else if (operator == "/") {

                if (num2 == 0) {
                    document.getElementById("result").innerHTML =
                        "Cannot divide by 0";
                    return;
                }

                result = num1 / num2;
            }

            // Show result
            document.getElementById("result").innerHTML =
                "Result: " + result;
        }

    </script>

</body>
</html>
