<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white border-2 border-[#a2828b] rounded-xl p-6 w-full max-w-md shadow-lg">

        <h1 class="text-3xl font-bold text-[#8c6a74] mb-6 text-center">
            Scientific Calculator
        </h1>

        <!-- Display -->
        <input
            type="text"
            id="display"
            readonly
            placeholder="0"
            class="w-full p-4 mb-4 border-2 border-[#a2828b] rounded text-right text-2xl"
        >

        <!-- Calculator Buttons -->
        <div class="grid grid-cols-4 gap-2">

            <button onclick="clearDisplay()" class="calc-btn">AC</button>
            <button onclick="deleteLast()" class="calc-btn">DEL</button>
            <button onclick="append('(')" class="calc-btn">(</button>
            <button onclick="append(')')" class="calc-btn">)</button>

            <button onclick="calculate('sin')" class="calc-btn">sin</button>
            <button onclick="calculate('cos')" class="calc-btn">cos</button>
            <button onclick="calculate('tan')" class="calc-btn">tan</button>
            <button onclick="append('/')" class="calc-btn">÷</button>

            <button onclick="calculate('log')" class="calc-btn">log</button>
            <button onclick="calculate('ln')" class="calc-btn">ln</button>
            <button onclick="calculate('sqrt')" class="calc-btn">√</button>
            <button onclick="append('*')" class="calc-btn">×</button>

            <button onclick="calculate('square')" class="calc-btn">x²</button>
            <button onclick="append('^')" class="calc-btn">xʸ</button>
            <button onclick="append('π')" class="calc-btn">π</button>
            <button onclick="append('-')" class="calc-btn">−</button>

            <button onclick="append('7')" class="calc-btn">7</button>
            <button onclick="append('8')" class="calc-btn">8</button>
            <button onclick="append('9')" class="calc-btn">9</button>
            <button onclick="append('+')" class="calc-btn">+</button>

            <button onclick="append('4')" class="calc-btn">4</button>
            <button onclick="append('5')" class="calc-btn">5</button>
            <button onclick="append('6')" class="calc-btn">6</button>
            <button onclick="append('.')" class="calc-btn">.</button>

            <button onclick="append('1')" class="calc-btn">1</button>
            <button onclick="append('2')" class="calc-btn">2</button>
            <button onclick="append('3')" class="calc-btn">3</button>
            <button onclick="append('0')" class="calc-btn">0</button>

            <button onclick="calculate('factorial')" class="calc-btn">x!</button>
            <button onclick="append('%')" class="calc-btn">%</button>
            <button onclick="append('π')" class="calc-btn">π</button>
            <button onclick="calculate('equal')" class="calc-btn bg-[#8c6a74] text-white">=</button>

        </div>

        <div id="result" class="text-xl font-bold text-[#8c6a74] text-center mt-5">
            Result
        </div>

        <p class="text-xs text-gray-500 text-center mt-3">
            Trigonometric functions use degrees.
        </p>

    </div>

    <style>
        .calc-btn {
            padding: 12px 4px;
            border: 2px solid #a2828b;
            border-radius: 8px;
            color: #8c6a74;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .calc-btn:hover {
            background-color: #a2828b;
            color: white;
        }
    </style>

    <script>
        let display = document.getElementById("display");
        let result = document.getElementById("result");

        function append(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = "";
            result.innerHTML = "Result";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate(operator) {

            let num = Number(display.value);
            let answer;

            if (display.value === "") {
                result.innerHTML = "Enter a number!";
                return;
            }

            if (operator == "sqrt") {
                answer = Math.sqrt(num);
            }
            else if (operator == "square") {
                answer = num * num;
            }
            else if (operator == "sin") {
                answer = Math.sin(num * Math.PI / 180);
            }
            else if (operator == "cos") {
                answer = Math.cos(num * Math.PI / 180);
            }
            else if (operator == "tan") {
                if (Math.abs(Math.cos(num * Math.PI / 180)) < 0.0000000001) {
                    result.innerHTML = "Tan is undefined";
                    return;
                }
                answer = Math.tan(num * Math.PI / 180);
            }
            else if (operator == "log") {
                if (num <= 0) {
                    result.innerHTML = "Enter a positive number!";
                    return;
                }
                answer = Math.log10(num);
            }
            else if (operator == "ln") {
                if (num <= 0) {
                    result.innerHTML = "Enter a positive number!";
                    return;
                }
                answer = Math.log(num);
            }
            else if (operator == "factorial") {
                if (num < 0 || !Number.isInteger(num) || num > 170) {
                    result.innerHTML = "Enter an integer from 0 to 170";
                    return;
                }

                answer = 1;

                for (let i = 1; i <= num; i++) {
                    answer = answer * i;
                }
            }
            else if (operator == "equal") {
                try {
                    let expression = display.value
                        .replace(/π/g, "Math.PI")
                        .replace(/\^/g, "**");

                    // Only basic arithmetic expressions are accepted here.
                    if (!/^[0-9+\-*/%.()\s*MathPIE]+$/.test(expression)) {
                        result.innerHTML = "Invalid expression";
                        return;
                    }

                    answer = Function('"use strict"; return (' + expression + ')')();

                    if (!Number.isFinite(answer)) {
                        result.innerHTML = "Invalid calculation";
                        return;
                    }
                }
                catch {
                    result.innerHTML = "Invalid expression";
                    return;
                }
            }

            if (answer === undefined || !Number.isFinite(answer)) {
                result.innerHTML = "Invalid calculation";
                return;
            }

            answer = Number(answer.toFixed(8));

            display.value = answer;
            result.innerHTML = "Result: " + answer;
        }
    </script>

</body>
</html>
